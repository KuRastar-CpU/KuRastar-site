<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KuRastars_ の Scratch 作品を集めた、星とコードのプレイグラウンド。"
    />
    <meta name="theme-color" content="#100b22" />
    <title>KuRastars_ | Scratch Playground</title>
    <link rel="stylesheet" href="styles.css" /></head
  ><link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
  <body>
    <a class="skip-link" href="#works">作品一覧へスキップ</a>

    <div class="page-glow glow-one" aria-hidden="true"></div>
    <div class="page-glow glow-two" aria-hidden="true"></div>
    <div class="star-field" aria-hidden="true"></div>

    <header class="site-header">
      <div class="shell nav-shell">
        <a class="brand" href="#top" aria-label="KuRastars_ のトップへ">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>KuRastars<span class="brand-underscore">_</span></span>
        </a>

        <nav class="main-nav" aria-label="メインメニュー">
          <a href="#works">WORKS</a>
          <a href="#about">ABOUT</a>
          <a href="#connect">CONNECT</a>
        </nav>

        <a
          class="nav-profile-link"
          href="https://scratch.mit.edu/users/KuRastars_/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Scratchへ <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <main id="top">
      <section class="hero shell" aria-labelledby="hero-title">
        <div class="hero-copy reveal">
          <p class="eyebrow">
            <span class="eyebrow-dot"></span> SCRATCH CREATOR / JAPAN
          </p>
          <h1 id="hero-title">コードで、<br /><em>ひらめきを</em>動かす。</h1>
          <p class="hero-description">
            ゲーム、学び、そして小さな「できた！」を。<br />
            KuRastars_ の Scratch 作品を、ここから遊びにいこう。
          </p>
          <div class="hero-actions">
            <a class="button button-primary" href="#works">
              <span>作品であそぶ</span
              ><span class="button-arrow" aria-hidden="true">↓</span>
            </a>
            <a
              class="text-link"
              href="https://scratch.mit.edu/users/KuRastars_/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Scratchプロフィールを見る <span aria-hidden="true">↗</span>
            </a>
          </div>
          <p class="live-note">
            <span class="pulse-dot" aria-hidden="true"></span>
            Scratchで公開中の代表作品をピックアップ
          </p>
        </div>

        <div
          class="hero-art reveal"
          aria-label="星のロボットとカラフルなコードブロックのイラスト"
          role="img"
        >
          <div class="art-orbit orbit-a" aria-hidden="true"></div>
          <div class="art-orbit orbit-b" aria-hidden="true"></div>
          <div class="spark spark-one" aria-hidden="true">✦</div>
          <div class="spark spark-two" aria-hidden="true">✦</div>
          <div class="spark spark-three" aria-hidden="true">•</div>

          <div class="code-block block-motion" aria-hidden="true">
            <span class="block-notch"></span>
            <span class="mini-code">move</span>
            <strong>10</strong>
          </div>
          <div class="code-block block-look" aria-hidden="true">
            <span class="block-notch"></span>
            <span class="mini-code">say</span>
            <strong>HELLO!</strong>
          </div>
          <div class="code-block block-event" aria-hidden="true">
            <span class="block-notch"></span>
            <span class="flag">⚑</span>
          </div>

          <button
            class="star-bot"
            id="hello-button"
            type="button"
            aria-label="星のロボットにあいさつする"
          >
            <span class="bot-antenna" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
